# ==========================================================
# SWAGGER DOCUMENTATION PROXY ROUTES
# ==========================================================

# ----------------------------------------------------------
# AUTH SWAGGER
# ----------------------------------------------------------

spring.cloud.gateway.server.webflux.routes[7].id=auth-swagger
spring.cloud.gateway.server.webflux.routes[7].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/swagger/auth/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/swagger/auth/(?<remaining>.*), /${remaining}


