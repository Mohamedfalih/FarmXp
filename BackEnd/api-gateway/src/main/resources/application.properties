# ==========================================================
# APPLICATION
# ==========================================================

spring.application.name=api-gateway
server.port=9090


# ==========================================================
# EUREKA
# ==========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==========================================================
# API ROUTES
# ==========================================================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


spring.cloud.gateway.server.webflux.routes[1].id=farmer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FARMER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/farmers/**


spring.cloud.gateway.server.webflux.routes[2].id=sustainability-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SUSTAINABILITY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/sustainability/**


spring.cloud.gateway.server.webflux.routes[3].id=learning-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://LEARNING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/learning/**


spring.cloud.gateway.server.webflux.routes[4].id=scheme-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://SCHEME-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/schemes/**


spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**


spring.cloud.gateway.server.webflux.routes[6].id=market-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://MARKET-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/market/**


spring.cloud.gateway.server.webflux.routes[7].id=ai-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/ai/**


# ==========================================================
# SWAGGER PROXY ROUTES
# ==========================================================

spring.cloud.gateway.server.webflux.routes[8].id=auth-swagger
spring.cloud.gateway.server.webflux.routes[8].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/swagger/auth/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/swagger/auth/(?<segment>.*), /${segment}


spring.cloud.gateway.server.webflux.routes[9].id=farmer-swagger
spring.cloud.gateway.server.webflux.routes[9].uri=lb://FARMER-SERVICE
