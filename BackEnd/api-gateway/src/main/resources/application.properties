# ==========================================================
# SWAGGER UI
# ==========================================================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/swagger/auth/v3/api-docs

springdoc.swagger-ui.urls[1].name=Farmer Service
springdoc.swagger-ui.urls[1].url=/swagger/farmer/v3/api-docs

springdoc.swagger-ui.urls[2].name=Sustainability Service
springdoc.swagger-ui.urls[2].url=/swagger/sustainability/v3/api-docs

springdoc.swagger-ui.urls[3].name=Learning Service
springdoc.swagger-ui.urls[3].url=/swagger/learning/v3/api-docs

springdoc.swagger-ui.urls[4].name=Scheme Service
springdoc.swagger-ui.urls[4].url=/swagger/scheme/v3/api-docs

springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=/swagger/notification/v3/api-docs

springdoc.swagger-ui.urls[6].name=Market Service
springdoc.swagger-ui.urls[6].url=/swagger/market/v3/api-docs

springdoc.swagger-ui.urls[7].name=AI Service
springdoc.swagger-ui.urls[7].url=/swagger/ai/v3/api-docs


# ==========================================================
# CORS
# ==========================================================

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
eureka.instance.prefer-ip-address=true
