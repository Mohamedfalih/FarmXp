spring.application.name=api-gateway

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=farmer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FARMER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/farmers/**

spring.cloud.gateway.server.webflux.routes[2].id=sustainability-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SUSTAINABILITY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/sustainability/**